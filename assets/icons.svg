<?xml version="1.0" encoding="UTF-8"?>
<!-- Fatura Boa icon sprite. Same-origin, referenced as <use href="/assets/icons.svg#fb-nome">.
     Every icon is stroke-based on a 24x24 grid, currentColor, so it inherits the nav state colour
     and survives greyscale (05-component-specs: an icon never carries meaning alone - it always
     ships with its text label). No fills, so a printed page keeps the outline.
     Kept ASCII-only, same rule as tool.js. -->
